name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull -t twf:ci .

      - name: Smoke test
        run: |
          set -eux
          docker run --rm twf:ci version
          docker run --rm twf:ci help | grep -q 'Usage:'
          docker run --rm twf:ci estimate 4 --rate 300 --price 1.12 | grep -q '16.8M'
          # wrong ending -> usage error (exit 2)
          code=0; docker run --rm twf:ci 'a!b' || code=$?; test "$code" = 2
          # real 1-char search, encrypted result, decrypt it back
          mkdir -p out && chmod 777 out
          docker run --rm -e TWF_PASSWORD=ci-pass -v "$PWD/out:/results" twf:ci find a --workers 2 --wallet v5r1 | tee find.log
          grep -q 'FOUND 1/1' find.log
          docker run --rm -e TWF_PASSWORD=ci-pass -v "$PWD/out:/results" twf:ci decrypt ton_wallet_results.enc.json \
            | grep -q '^Wallet: .*a$'
          docker run --rm twf:ci bench --seconds 5 --workers 2 | grep -q 'addresses/s'

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          tags="sha-${SHA::7}"
          if [ "$REF_TYPE" = tag ]; then
            tags="$tags ${REF_NAME#v}"
          elif [ "$REF_NAME" = main ]; then
            tags="$tags latest"
          fi
          for t in $tags; do
            docker tag twf:ci "$image:$t"
            docker push "$image:$t"
          done
          echo "Pushed: $tags" >> "$GITHUB_STEP_SUMMARY"
